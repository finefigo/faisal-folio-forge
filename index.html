<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <script>
      try {
        const savedTheme = window.localStorage.getItem("portfolio-theme");
        const systemTheme = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        document.documentElement.dataset.theme =
          savedTheme === "light" || savedTheme === "dark" ? savedTheme : systemTheme;
      } catch {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#08111d" />
    <meta
      name="description"
      content="Faisal Imtiaz is a final-year Computer Science and Engineering student focused on full-stack development and applied AI/ML."
    />
    <meta name="author" content="Faisal Imtiaz" />

    <meta property="og:title" content="Faisal Imtiaz | Portfolio" />
    <meta
      property="og:description"
      content="Full-stack development, applied AI/ML, Android, computer vision, and developer tooling."
    />
    <meta property="og:type" content="website" />
    <meta
      property="og:image"
      content="https://i.postimg.cc/qqV5z5Hn/Whats-App-Image-2024-09-28-at-22-24-41-0633665e.jpg"
    />
    <meta property="og:image:alt" content="Faisal Imtiaz" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:image"
      content="https://i.postimg.cc/qqV5z5Hn/Whats-App-Image-2024-09-28-at-22-24-41-0633665e.jpg"
    />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Faisal Imtiaz | Portfolio</title>
  </head>

    <div id="root"></div>

  </body>
</html>
